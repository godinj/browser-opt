<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Opt</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #5b5ce2;
        --accent-strong: #4949c7;
        --accent-soft: #eeeeff;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --surface-hover: #f7f7fc;
        --text: #20212b;
        --muted: #656879;
        --border: #dedfe8;
        --focus: rgba(91, 92, 226, 0.25);
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --success: #16794b;
        --success-soft: #eaf8f0;
        --shadow: 0 10px 30px rgba(30, 33, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 380px;
        background: var(--bg);
      }

      body {
        width: 100%;
        min-width: 380px;
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 11px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        filter: drop-shadow(0 3px 6px rgba(73, 73, 199, 0.22));
      }

      .heading {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 720;
        letter-spacing: -0.01em;
      }

      #mode-description {
        margin: 1px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mode-nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin: 0 12px 12px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in srgb, var(--surface) 72%, transparent);
      }

      .mode-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 31px;
        padding: 5px 8px;
        border-radius: 7px;
        color: var(--muted);
        font-weight: 650;
        text-decoration: none;
      }

      .mode-link:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      .mode-link[aria-current="page"] {
        color: var(--accent-strong);
        background: var(--surface);
        box-shadow: 0 1px 4px rgba(30, 33, 51, 0.12);
      }

      .mode-icon {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      main {
        padding: 0 12px 12px;
      }

      .search-shell {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 8px;
      }

      .search-icon {
        position: absolute;
        left: 11px;
        width: 15px;
        height: 15px;
        fill: none;
        stroke: var(--muted);
        stroke-linecap: round;
        stroke-width: 1.8;
        pointer-events: none;
      }

      input[type="search"],
      input[type="text"] {
        width: 100%;
        height: 38px;
        padding: 7px 48px 7px 34px;
        border: 1px solid var(--border);
        border-radius: 9px;
        outline: none;
        color: var(--text);
        background: var(--surface);
      }

      input::placeholder {
        color: color-mix(in srgb, var(--muted) 78%, transparent);
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .search-hint {
        position: absolute;
        right: 9px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--muted);
        background: var(--bg);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
      }

      .result-list {
        max-height: 440px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(30, 33, 51, 0.04);
        scrollbar-color: var(--border) transparent;
      }

      .result {
        position: relative;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 54px;
        margin: 0;
        padding: 8px 10px;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        color: var(--text);
        background: var(--surface);
        text-align: left;
        cursor: pointer;
      }

      .result:last-child {
        border-bottom: 0;
      }

      .result:hover,
      .result:focus-visible {
        z-index: 1;
        outline: none;
        background: var(--surface-hover);
        box-shadow: inset 3px 0 var(--accent);
      }

      .result.active {
        background: var(--accent-soft);
      }

      .result.active::before {
        position: absolute;
        top: 10px;
        bottom: 10px;
        left: 0;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
        content: "";
      }

      .result-copy {
        min-width: 0;
      }

      .result-title,
      .result-detail,
      .result-meta {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-title {
        font-weight: 650;
      }

      .result-detail,
      .result-meta {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11.5px;
      }

      .tab-icon-wrap,
      .action-icon,
      .archive-icon {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 7px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 12px;
        font-weight: 720;
      }

      .tab-icon {
        width: 17px;
        height: 17px;
        object-fit: contain;
      }

      .tab-fallback[hidden],
      .tab-icon[hidden] {
        display: none;
      }

      .archive-icon svg,
      .action-icon svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .action-result {
        min-height: 58px;
      }

      .action-description {
        white-space: normal;
      }

      .result-badge {
        align-self: start;
        margin-top: 2px;
        padding: 2px 6px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--bg);
        font-size: 10px;
        font-weight: 680;
        white-space: nowrap;
      }

      .result-badge.danger {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .empty-state {
        display: grid;
        min-height: 120px;
        padding: 22px;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 3px;
        color: var(--text);
        font-size: 13px;
      }

      .loading-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        to { opacity: 0.25; transform: scale(0.75); }
      }

      #status {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
      }

      #status[data-tone="success"] {
        border-color: color-mix(in srgb, var(--success) 25%, var(--border));
        color: var(--success);
        background: var(--success-soft);
      }

      #status[data-tone="error"] {
        border-color: color-mix(in srgb, var(--danger) 25%, var(--border));
        color: var(--danger);
        background: var(--danger-soft);
      }

      .hidden,
      #status:empty {
        display: none !important;
      }

      .dialog-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        padding: 20px;
        place-items: center;
        background: rgba(20, 21, 29, 0.36);
        backdrop-filter: blur(2px);
      }

      .dialog {
        width: min(100%, 350px);
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .dialog h2 {
        margin: 0 0 4px;
        font-size: 15px;
      }

      .dialog p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .dialog input {
        padding: 7px 10px;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }

      .dialog-button {
        min-width: 74px;
        padding: 7px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
      }

      .dialog-button.primary {
        border-color: var(--accent);
        color: #ffffff;
        background: var(--accent);
      }

      .dialog-button.primary:hover {
        background: var(--accent-strong);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #9a8cff;
          --accent-strong: #c1b8ff;
          --accent-soft: #302d52;
          --bg: #18191f;
          --surface: #22232b;
          --surface-hover: #2a2b35;
          --text: #f2f2f6;
          --muted: #a9abb8;
          --border: #3a3c47;
          --focus: rgba(154, 140, 255, 0.28);
          --danger: #ff9b91;
          --danger-soft: #4a2929;
          --success: #7cdaa8;
          --success-soft: #203b2d;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <img class="brand-icon" src="icons/browser-opt.svg" alt="">
      <div class="heading">
        <h1 id="mode-title">Browser Opt</h1>
        <p id="mode-description">Find an open tab without leaving the keyboard.</p>
      </div>
    </header>

    <nav class="mode-nav" aria-label="Browser Opt tools">
      <a class="mode-link" data-mode="tabs" href="popup.html?mode=tabs">
        <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v8h-11zM5 13.5h6"/></svg>
        Tabs
      </a>
      <a class="mode-link" data-mode="actions" href="popup.html?mode=actions">
        <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10M5 2v4M10 6v4M7 10v4"/></svg>
        Actions
      </a>
      <a class="mode-link" data-mode="history" href="popup.html?mode=history">
        <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v3h3M3.5 5.5A5 5 0 1 1 3 9M8 5.25V8l2 1.25"/></svg>
        Archive
      </a>
    </nav>

    <main>
      <section id="tab-panel">
        <label class="sr-only" for="tab-search">Search open tabs</label>
        <div class="search-shell">
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="tab-search" type="search" placeholder="Search title or URL" autocomplete="off" spellcheck="false">
          <span class="search-hint" data-shortcut="U" aria-hidden="true">⌘⇧U</span>
        </div>
        <div id="tab-results" class="result-list" role="listbox" aria-label="Open tabs"></div>
      </section>

      <section id="action-panel" class="hidden">
        <label class="sr-only" for="action-search">Search actions</label>
        <div class="search-shell">
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="action-search" type="search" placeholder="Search actions" autocomplete="off" spellcheck="false">
          <span class="search-hint" data-shortcut="Y" aria-hidden="true">⌘⇧Y</span>
        </div>
        <div id="action-results" class="result-list" role="listbox" aria-label="Actions"></div>
      </section>

      <section id="archive-panel" class="hidden">
        <label class="sr-only" for="archive-search">Search archived tabs</label>
        <div class="search-shell">
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="archive-search" type="search" placeholder="Search archived tabs" autocomplete="off" spellcheck="false">
          <span class="search-hint" data-shortcut="I" aria-hidden="true">⌘⇧I</span>
        </div>
        <div id="archive-results" class="result-list" role="listbox" aria-label="Archived tabs"></div>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </main>

    <div id="prompt-dialog" class="dialog-backdrop hidden">
      <form id="prompt-form" class="dialog" role="dialog" aria-modal="true" aria-labelledby="prompt-title" aria-describedby="prompt-description">
        <h2 id="prompt-title">Enter a title</h2>
        <p id="prompt-description">Choose a clear name you will recognize later.</p>
        <label class="sr-only" for="prompt-input">Title</label>
        <input id="prompt-input" type="text" autocomplete="off" required>
        <div class="dialog-actions">
          <button id="prompt-cancel" class="dialog-button" type="button">Cancel</button>
          <button class="dialog-button primary" type="submit">Save</button>
        </div>
      </form>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
